<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0%;
        margin: 0%;
        box-sizing: border-box;
    }
    body{
        background-color: #fab22e;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;

    }
    .container{
        background-color: black;
        width: 30%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 5px 0 black;
        border-radius: 3px;
        padding: 20px;
        gap: 30px;
    }
    button{
        padding: 10px;
        background-color: #fab22e;
        border: none; 
        border-radius: 5px;
        cursor: pointer;
        width: 70%;
    }
    .box p{
        text-align: center;
        color: white;
    }
    

</style>
<body>
    <div class="container">
        <img src="image.png" alt="image" width="100px">
        <div class="box">
            <p></p>
        </div>
        <button><b>Get Random Joke</b></button>
    </div>
    <script>
        const url = "https://v2.jokeapi.dev/joke/Any"
        const box = document.querySelector(".box");
        const btn = document.querySelector("button");
        const p = document.querySelector("p");

        async function randomJoke() {
            const response = await fetch(url);
            const data = await response.json();
            p.innerHTML = `${data.joke}`
            console.log(data)
        }
        btn.addEventListener("click", randomJoke)
    </script>
</body>
</html>
